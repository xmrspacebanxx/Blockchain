<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaMask Clone</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="wallet-info">
                <div class="wallet-name">NewEraBank(c)</div>
                <div class="wallet-name">16e359454ce1943</div>
                <div class="wallet-actions">
                    <i onclick="startMining()" class="fa-solid fa-fire"></i>
                    <i onclick="stopMining()" class="fa-solid fa-leaf"></i> <!-- Icono de perfil -->
                    <i class="fa-solid fa-gas-pump"></i> <!-- Icono de menú -->
                </div>
            </div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>

        </header>
        
        <nav id="buttons" style="display: none;">
            <button class="tab active">Materials</button>
            <button class="tab ">Transactions</button>
        </nav>
        
        <main>
            <div class="balance">
                <div>
                    <button onclick="getBalance()" id="balance-button"><i class="fa-solid fa-rotate-right"></i></button>
                    <h1 id="balance" class="data">******</h1>
                </div>
            </div>
            <div class="actions" id="actions">
                <button onclick="send()"><i class="fa-solid fa-satellite-dish"></i> Send</button>
                <button onclick="receive()"><i class="fa-solid fa-satellite"></i> Receive</button>
                <button onclick="addSC()"><i class="fa-solid fa-barcode"></i> Add NFT</button>
                <button onclick="buy()"><i class="fa-solid fa-barcode"></i> Buy NFT</button>
            </div>
            <div class="crypto-buy" id="crypto-buy">
                <h3 class="Items">NFT 
                <button onclick="getItems()"><i class="fa-solid fa-rotate-right"></i></button></h3>
                <div id="items" class="no-memo">Loading data...</div>
            </div>
        </main>
        
        <footer>
            <button class="footer-btn" onclick="home()"><i class="fa-solid fa-wallet"></i>Home</button>
            <button class="footer-btn" onclick="home()"><i class="fa-solid fa-bag-shopping"></i>NFT</button>
            <button class="footer-btn" onclick="settings()"><i class="fa-solid fa-user-astronaut"></i>Login</button>
            <button class="footer-btn" onclick="buy()"><i class="fa-solid fa-meteor"></i>Store Pool</button>
            <button class="footer-btn" onclick="book()"><i class="fa-solid fa-cubes"></i>Blockchain</button>
        </footer>
        <script src="./scripts.js"></script>
    </div>
</body>
</html>
