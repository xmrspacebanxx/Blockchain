<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetaMask Clone</title>
    <script defer src="./scripts.js"></script>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="wallet-info">
                <div class="wallet-name">BitcoinCoreLT</div>
                <div id="price" class="wallet-name">$105,000.00</div>
                <div class="wallet-actions">
                    <i onclick="getBalance()" id="balance-button" class="fa-solid fa-bitcoin-sign"></i>
                    <i onclick="startMining()" id="start-button" class="fa-solid fa-play"></i>
                    <i onclick="stopMining()" id="'stop-button" class="fa-solid fa-pause"></i> <!-- Icono de perfil -->
                </div>
            </div>
            <div id="progress-container">
                <div id="progress-bar"></div>
            </div>
            <div id="public-key" class="wallet-name">am28Ja4nZRbH8XeLAa</div>

        </header>
        
        <nav id="buttons" style="display: none;">
            <button class="tab active">Materials</button>
            <button class="tab ">Transactions</button>
            <button onclick="getBalance()" id="balance-button"><i class="fa-solid fa-rotate-right"></i></button>
        </nav>
        
        <main>
            <div class="balance">
                <div>
                    <h1 id="balance" class="data">0.000000000000BTC</h1>
                    <h2 id="cop" class="data">$0.00</h2>
                </div>
            </div>
            <div class="actions" id="actions">
                <button onclick="send()"><i class="fa-solid fa-circle-arrow-up"></i> Send</button>
                <button onclick="receive()"><i class="fa-solid fa-circle-arrow-down"></i> Receive</button>
                <button onclick="addSC()"><i class="fa-solid fa-barcode"></i> Add NFT</button>
                <button onclick="buy()"><i class="fa-solid fa-barcode"></i> Buy NFT</button>
            </div>
            <div class="crypto-buy" id="crypto-buy">
                <h3 class="Items">History 
                <button onclick="getItems()"><i class="fa-solid fa-download"></i></button></h3>
                <div id="items" class="no-memo">Loading data...</div>
            </div>
        </main>
        
        <footer>
            <button class="footer-btn" onclick="home()"><i class="fa-solid fa-wallet"></i>My Account</button>
            <button class="footer-btn" onclick="buy()"><i class="fa-solid fa-money-bill-1"></i>ATM</button>
            <button class="footer-btn" onclick="settings()"><i class="fa-solid fa-lock"></i>Login</button>
            <button class="footer-btn" onclick="book()"><i class="fa-solid fa-cubes"></i>Blockchain</button>
            <button class="footer-btn" onclick="home()"><i class="fa-solid fa-book"></i>Address Book</button>
        </footer>
    </div>
</body>
</html>
